<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
</head>
<body class="popup">
  <p>Connect Epic Tasks to your Trello account. You only need to do this once.</p>
  <button id="go" class="mod-primary">Connect</button>
  <p id="err" class="error" hidden></p>
  <script>
    var t = TrelloPowerUp.iframe(EpicAuth.iframeOptions());
    document.getElementById('go').addEventListener('click', function () {
      EpicAuth.authorize(t)
        .then(function () {
          document.getElementById('go').hidden = true;
          document.querySelector('p').textContent = '✓ Connected. You can close this window.';
          // Trello can't close this popup when it was opened from the board-header menu.
          Promise.resolve().then(function () { return t.closePopup(); }).catch(function () {});
        })
        .catch(function (e) {
          var el = document.getElementById('err');
          el.hidden = false;
          el.textContent = 'Could not connect: ' + (e && e.message ? e.message : e);
        });
    });
  </script>
</body>
</html>
