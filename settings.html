<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
</head>
<body class="popup">
  <form id="f">
    <label for="todo"><b>Список TODO</b> — куди створювати картки</label>
    <select id="todo" required></select>

    <label><b>Списки «виконано»</b> — картка в них вважається готовою</label>
    <div id="done" class="checks"></div>

    <label><b>Нові картки додавати</b></label>
    <div class="checks">
      <label><input type="radio" name="pos" value="top"> зверху списку</label>
      <label><input type="radio" name="pos" value="bottom"> знизу списку</label>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="labels"> Ставити мітки пріоритету (P1 🔴 / P2 🟠 / P3 🟢)</label>
      <label><input type="checkbox" id="auto"> Автоматично закривати пункт в епіку, коли всі його TODO-картки виконані</label>
    </div>

    <button type="submit" class="mod-primary">Зберегти</button>
  </form>
  <script src="./js/settings.js"></script>
</body>
</html>
