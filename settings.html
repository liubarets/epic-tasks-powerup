<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/points.js"></script>
</head>
<body class="popup">
  <form id="f">
    <label for="todo"><b>TO DO list</b> — where new cards go</label>
    <select id="todo" required></select>

    <label><b>Done lists</b> — cards in these lists count as done</label>
    <div id="done" class="checks"></div>

    <label><b>Add new cards</b></label>
    <div class="checks">
      <label><input type="radio" name="pos" value="top"> at the top of the list</label>
      <label><input type="radio" name="pos" value="bottom"> at the bottom of the list</label>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="auto"> Keep epic items in sync: tick when all TO&nbsp;DO cards are in Done, untick when one is moved back</label>
    </div>

    <h3 class="sec">Story points</h3>
    <div class="checks">
      <label><input type="checkbox" id="sp-on"> Show story points: &#931; button on the board and a badge on every card</label>
    </div>
    <div id="sp-field" class="sp-field"></div>
    <div class="checks">
      <label><input type="checkbox" id="sp-migrate"> Move [n] or (n) from card titles into the field automatically</label>
    </div>
    <div class="sp-move"><button type="button" class="link" id="sp-move"></button> <span id="sp-move-msg" class="muted"></span></div>

    <button type="submit" class="mod-primary">Save</button>
  </form>
  <script src="./js/settings.js"></script>
</body>
</html>
